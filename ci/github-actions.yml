# CI template: copy to .github/workflows/tests.yml after granting workflow write access.
name: PHP SDK tests

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4', '8.5']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: ${{ matrix.php }}
          extensions: curl, json, openssl, pdo_sqlite
          ini-values: zend.exception_ignore_args=On
          tools: composer:2.10.3
          coverage: none
      - run: composer install --no-interaction --no-progress --prefer-dist
      - run: composer validate --strict
      - run: composer lint
      - run: composer test
